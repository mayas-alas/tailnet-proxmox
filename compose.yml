services:
  proxmox:
    hostname: pve
    image: ghcr.io/mayas-alas/tailnet-proxmox:9.2.21-gnx.1
    container_name: proxmox
    environment:
      PASSWORD: "root"
    ports:
      - 8006:8006
    volumes:
      - ./data:/var/lib/vz
      - ./config:/var/lib/pve-cluster
    restart: always
    privileged: true
    stop_grace_period: 2m
