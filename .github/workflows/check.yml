name: Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x --source-path=src -e SC2114 -e SC2129 -e SC2034 -e SC1087 -e SC2317 -e SC2046

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3018,DL3020,DL3029,DL3059,DL4006,DL4001,SC2114,DL3006,DL3027
          failure-threshold: warning

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        env:
          TS_AUTHKEY: test-key
          TS_HOSTNAME: proxmox
          TS_CERT_DOMAIN: proxmox.example.ts.net
          PASSWORD: root
          DEVS: eth0 eth1 eth2
          BRIDGES: vmbr0 vmbr1 vmbr2
          GATEWAYS: 172.30.10.1 172.30.11.1 172.30.12.1
        run: docker compose config --quiet
